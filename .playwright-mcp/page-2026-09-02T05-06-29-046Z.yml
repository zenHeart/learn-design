      - paragraph [ref=e195]:
        - strong [ref=e196]: 判断现有设计是否有问题
        - text: （design review）—— 先到「场景落地」确认产品类型的反模式，再用「判断依据」层的十启发式逐条走查、WCAG 硬数字判合规，最后用 UX 法则做心理学归因。输出结论区分"确定违规"（有硬数字支撑）与"风格建议"（注明主观），并主动排除已证伪教条。
      - paragraph [ref=e197]:
        - strong [ref=e198]: 按某个设计风格重构
        - text: （style refactor）—— 到「参照体系」选定语言体系（Material 3 / HIG / Fluent 2 / Ant Design v6…），提取该语言的 tokens、组件约定与明暗策略，回「场景落地」校验产品类型约束不冲突，落地优先复用该语言官方组件库。
      - paragraph [ref=e199]:
        - strong [ref=e200]: 以专业设计师视角审视
        - text: （professional critique）—— 按「方法流程」的提问顺序自战略层向表现层逐层检查，用「认知入口」的四问框架（心智模型匹配吗？五特征达标吗？流程想清楚了吗？情感层加分吗？），结论按"问题 → 根因（法则引用）→ 建议"组织。
