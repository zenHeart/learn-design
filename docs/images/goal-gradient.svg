<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bad-bg { fill: #ffebee; }
      .good-bg { fill: #e8f5e9; }
      .progress-bg { fill: #e0e0e0; rx: 10; }
      .progress-fill { fill: #4caf50; rx: 10; }
      .milestone { fill: #ffc107; }
      .reward { fill: #ff9800; }
      .btn { fill: #9e9e9e; rx: 8; }
      .btn-active { fill: #4caf50; rx: 8; }
    </style>
  </defs>
  
  <!-- BAD Example -->
  <rect x="10" y="10" width="380" height="380" class="bad-bg" rx="10"/>
  <text x="200" y="45" text-anchor="middle" fill="#c62828" font-size="18" font-weight="bold">❌ BAD - 缺乏进度反馈</text>
  
  <!-- Progress bar with no motivation -->
  <g transform="translate(40, 80)">
    <text x="160" y="0" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">每日签到</text>
    
    <!-- Progress bar - 5/7 done but no visual reward -->
    <rect x="0" y="30" width="320" height="40" class="progress-bg"/>
    <rect x="0" y="30" width="228" height="40" class="progress-fill"/>
    <text x="160" y="57" text-anchor="middle" fill="#c62828" font-size="16" font-weight="bold">5/7 天</text>
    
    <!-- Day indicators -->
    <g transform="translate(0, 85)">
      <circle cx="25" cy="15" r="15" fill="#4caf50"/>
      <text x="25" y="19" text-anchor="middle" fill="white" font-size="10">1</text>
      <circle cx="75" cy="15" r="15" fill="#4caf50"/>
      <text x="75" y="19" text-anchor="middle" fill="white" font-size="10">2</text>
      <circle cx="125" cy="15" r="15" fill="#4caf50"/>
      <text x="125" y="19" text-anchor="middle" fill="white" font-size="10">3</text>
      <circle cx="175" cy="15" r="15" fill="#4caf50"/>
      <text x="175" y="19" text-anchor="middle" fill="white" font-size="10">4</text>
      <circle cx="225" cy="15" r="15" fill="#4caf50"/>
      <text x="225" y="19" text-anchor="middle" fill="white" font-size="10">5</text>
      <circle cx="275" cy="15" r="15" fill="#e0e0e0" stroke="#bdbdbd"/>
      <text x="275" y="19" text-anchor="middle" fill="#757575" font-size="10">6</text>
      <circle cx="325" cy="15" r="15" fill="#e0e0e0" stroke="#bdbdbd"/>
      <text x="325" y="19" text-anchor="middle" fill="#757575" font-size="10">7</text>
    </g>
    
    <!-- Motivational message missing -->
    <rect x="0" y="130" width="320" height="60" fill="#ffcdd2" rx="8"/>
    <text x="160" y="155" text-anchor="middle" fill="#c62828" font-size="12">还剩 2 天...</text>
    <text x="160" y="175" text-anchor="middle" fill="#c62828" font-size="11">看不到奖励，缺乏动力</text>
    
    <!-- CTA button -->
    <rect x="100" y="210" width="120" height="40" class="btn"/>
    <text x="160" y="236" text-anchor="middle" fill="white" font-size="12">明天再来</text>
    
    <text x="160" y="280" text-anchor="middle" fill="#c62828" font-size="11">❌ 用户可能放弃</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 400 200 L 430 200" stroke="#2196f3" stroke-width="3" fill="none"/>
  <polygon points="430,200 420,195 420,205" fill="#2196f3"/>
  
  <!-- GOOD Example -->
  <rect x="410" y="10" width="380" height="380" class="good-bg" rx="10"/>
  <text x="600" y="45" text-anchor="middle" fill="#2e7d32" font-size="18" font-weight="bold">✅ GOOD - 目标梯度激励</text>
  
  <!-- Progress bar with strong motivation -->
  <g transform="translate(440, 80)">
    <text x="160" y="0" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">每日签到</text>
    
    <!-- Progress bar with glow effect near goal -->
    <rect x="0" y="30" width="320" height="40" class="progress-bg"/>
    <rect x="0" y="30" width="228" height="40" class="progress-fill"/>
    <!-- Glow effect near the end -->
    <rect x="228" y="30" width="50" height="40" fill="#81c784" opacity="0.5"/>
    
    <text x="160" y="57" text-anchor="middle" fill="white" font-size="16" font-weight="bold">5/7 天</text>
    
    <!-- Day indicators with reward highlight -->
    <g transform="translate(0, 85)">
      <circle cx="25" cy="15" r="15" fill="#4caf50"/>
      <text x="25" y="19" text-anchor="middle" fill="white" font-size="10">1</text>
      <circle cx="75" cy="15" r="15" fill="#4caf50"/>
      <text x="75" y="19" text-anchor="middle" fill="white" font-size="10">2</text>
      <circle cx="125" cy="15" r="15" fill="#4caf50"/>
      <text x="125" y="19" text-anchor="middle" fill="white" font-size="10">3</text>
      <circle cx="175" cy="15" r="15" fill="#4caf50"/>
      <text x="175" y="19" text-anchor="middle" fill="white" font-size="10">4</text>
      <circle cx="225" cy="15" r="15" fill="#4caf50"/>
      <text x="225" y="19" text-anchor="middle" fill="white" font-size="10">5</text>
      <!-- Next day highlighted -->
      <circle cx="275" cy="15" r="18" fill="#ffc107" stroke="#ff9800" stroke-width="3"/>
      <text x="275" y="19" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">6</text>
      <circle cx="325" cy="15" r="15" fill="#e0e0e0" stroke="#bdbdbd"/>
      <text x="325" y="19" text-anchor="middle" fill="#757575" font-size="10">7</text>
    </g>
    
    <!-- Strong motivational message -->
    <rect x="0" y="130" width="320" height="60" fill="#c8e6c9" rx="8"/>
    <text x="160" y="150" text-anchor="middle" fill="#2e7d32" font-size="14">🎁 连续签到 7 天得大礼包！</text>
    <text x="160" y="172" text-anchor="middle" fill="#ff9800" font-size="12" font-weight="bold">再签 2 天就达标！加油！</text>
    
    <!-- CTA button with urgency -->
    <rect x="100" y="210" width="120" height="40" class="btn-active"/>
    <text x="160" y="236" text-anchor="middle" fill="white" font-size="12">立即签到</text>
    
    <text x="160" y="280" text-anchor="middle" fill="#2e7d32" font-size="11">✅ 用户不愿放弃，接近目标了！</text>
  </g>
</svg>