<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bad-bg { fill: #ffebee; }
      .good-bg { fill: #e8f5e9; }
      .menu { fill: white; stroke: #e0e0e0; rx: 8; }
      .menu-item { fill: #f5f5f5; rx: 4; }
      .menu-item-good { fill: #e8f5e9; rx: 4; }
      .highlight { fill: #4caf50; rx: 8; }
    </style>
  </defs>
  
  <!-- BAD Example -->
  <rect x="10" y="10" width="380" height="380" class="bad-bg" rx="10"/>
  <text x="200" y="45" text-anchor="middle" fill="#c62828" font-size="18" font-weight="bold">❌ BAD - 决策困难</text>
  
  <!-- Complex menu with too many options -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="320" height="280" class="menu"/>
    <text x="160" y="25" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">外卖分类</text>
    
    <!-- Many options - overwhelming -->
    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="140" height="30" class="menu-item"/>
      <text x="70" y="20" text-anchor="middle" fill="#333" font-size="12">川菜</text>
      
      <rect x="150" y="0" width="140" height="30" class="menu-item"/>
      <text x="220" y="20" text-anchor="middle" fill="#333" font-size="12">粤菜</text>
      
      <rect x="0" y="40" width="140" height="30" class="menu-item"/>
      <text x="70" y="60" text-anchor="middle" fill="#333" font-size="12">湘菜</text>
      
      <rect x="150" y="40" width="140" height="30" class="menu-item"/>
      <text x="220" y="60" text-anchor="middle" fill="#333" font-size="12">鲁菜</text>
      
      <rect x="0" y="80" width="140" height="30" class="menu-item"/>
      <text x="70" y="100" text-anchor="middle" fill="#333" font-size="12">浙菜</text>
      
      <rect x="150" y="80" width="140" height="30" class="menu-item"/>
      <text x="220" y="100" text-anchor="middle" fill="#333" font-size="12">闽菜</text>
      
      <rect x="0" y="120" width="140" height="30" class="menu-item"/>
      <text x="70" y="140" text-anchor="middle" fill="#333" font-size="12">苏菜</text>
      
      <rect x="150" y="120" width="140" height="30" class="menu-item"/>
      <text x="220" y="140" text-anchor="middle" fill="#333" font-size="12">徽菜</text>
      
      <rect x="0" y="160" width="140" height="30" class="menu-item"/>
      <text x="70" y="180" text-anchor="middle" fill="#333" font-size="12">日料</text>
      
      <rect x="150" y="160" width="140" height="30" class="menu-item"/>
      <text x="220" y="180" text-anchor="middle" fill="#333" font-size="12">韩餐</text>
      
      <rect x="0" y="200" width="140" height="30" class="menu-item"/>
      <text x="70" y="220" text-anchor="middle" fill="#333" font-size="12">西餐</text>
      
      <rect x="150" y="200" width="140" height="30" class="menu-item"/>
      <text x="220" y="220" text-anchor="middle" fill="#333" font-size="12">披萨</text>
    </g>
    
    <text x="160" y="265" text-anchor="middle" fill="#c62828" font-size="12">12 个选项，难以快速选择</text>
    <text x="160" y="285" text-anchor="middle" fill="#c62828" font-size="11">决策时间：5-10 秒</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 400 200 L 430 200" stroke="#2196f3" stroke-width="3" fill="none"/>
  <polygon points="430,200 420,195 420,205" fill="#2196f3"/>
  
  <!-- GOOD Example -->
  <rect x="410" y="10" width="380" height="380" class="good-bg" rx="10"/>
  <text x="600" y="45" text-anchor="middle" fill="#2e7d32" font-size="18" font-weight="bold">✅ GOOD - 快速决策</text>
  
  <!-- Simplified menu with categorization -->
  <g transform="translate(440, 70)">
    <rect x="0" y="0" width="320" height="280" class="menu"/>
    <text x="160" y="25" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">选择口味</text>
    
    <!-- Category first - only 3 options -->
    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="145" height="60" class="highlight"/>
      <text x="72" y="25" text-anchor="middle" fill="white" font-size="13">🌶️ 中餐</text>
      <text x="72" y="45" text-anchor="middle" fill="white" font-size="10">8 个菜系</text>
      
      <rect x="155" y="0" width="145" height="60" class="menu-item"/>
      <text x="227" y="25" text-anchor="middle" fill="#333" font-size="13">🍣 日韩</text>
      <text x="227" y="45" text-anchor="middle" fill="#757575" font-size="10">4 家餐厅</text>
      
      <rect x="0" y="70" width="145" height="60" class="menu-item"/>
      <text x="72" y="95" text-anchor="middle" fill="#333" font-size="13">🍕 西式</text>
      <text x="72" y="115" text-anchor="middle" fill="#757575" font-size="10">6 种选择</text>
      
      <rect x="155" y="70" width="145" height="60" class="menu-item"/>
      <text x="227" y="95" text-anchor="middle" fill="#333" font-size="13">🍜 面食</text>
      <text x="227" y="115" text-anchor="middle" fill="#757575" font-size="10">5 家店铺</text>
    </g>
    
    <text x="160" y="220" text-anchor="middle" fill="#2e7d32" font-size="12">先选大类，再选具体</text>
    <text x="160" y="240" text-anchor="middle" fill="#2e7d32" font-size="11">决策时间：1-2 秒 ✓</text>
  </g>
</svg>