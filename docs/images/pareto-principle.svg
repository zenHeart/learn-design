<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .pie-80 { fill: #4caf50; }
      .pie-20 { fill: #e0e0e0; }
      .bar-high { fill: #4caf50; }
      .bar-low { fill: #bdbdbd; }
    </style>
  </defs>
  
  <!-- Main content -->
  <text x="400" y="35" text-anchor="middle" fill="#333" font-size="20" font-weight="bold">帕累托原则 - 80% 效果来自 20% 原因</text>
  
  <!-- Pie Chart -->
  <g transform="translate(150, 180)">
    <!-- 80% slice -->
    <path d="M 100 0 A 100 100 0 1 1 100 -99.5 L 100 0 Z" class="pie-80"/>
    <!-- 20% slice -->
    <path d="M 100 -99.5 A 100 100 0 0 1 100 0 L 100 0 Z" class="pie-20"/>
    
    <text x="30" y="-30" fill="white" font-size="18" font-weight="bold">80%</text>
    <text x="55" y="50" fill="#757575" font-size="11">20%</text>
    
    <text x="100" y="130" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">功能使用分布</text>
  </g>
  
  <!-- Bar Chart - Feature Usage -->
  <g transform="translate(350, 80)">
    <text x="200" y="0" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">App 功能使用频率</text>
    
    <!-- Bars representing features -->
    <g transform="translate(0, 30)">
      <!-- 浏览 (80%) -->
      <rect x="0" y="0" width="160" height="30" class="bar-high" rx="4"/>
      <text x="10" y="20" fill="white" font-size="11">浏览</text>
      <text x="150" y="20" fill="white" font-size="10">80%</text>
      
      <!-- 搜索 (60%) -->
      <rect x="0" y="40" width="120" height="30" class="bar-high" rx="4"/>
      <text x="10" y="60" fill="white" font-size="11">搜索</text>
      <text x="110" y="60" fill="white" font-size="10">60%</text>
      
      <!-- 收藏 (40%) -->
      <rect x="0" y="80" width="80" height="30" class="bar-high" rx="4"/>
      <text x="10" y="100" fill="white" font-size="11">收藏</text>
      <text x="70" y="100" fill="white" font-size="10">40%</text>
      
      <!-- 评论 (15%) -->
      <rect x="0" y="120" width="30" height="30" class="bar-low" rx="4"/>
      <text x="10" y="140" fill="#757575" font-size="11">评论</text>
      <text x="30" y="140" fill="#757575" font-size="10">15%</text>
      
      <!-- 分享 (10%) -->
      <rect x="0" y="160" width="20" height="30" class="bar-low" rx="4"/>
      <text x="10" y="180" fill="#757575" font-size="11">分享</text>
      <text x="20" y="180" fill="#757575" font-size="10">10%</text>
      
      <!-- 设置 (5%) -->
      <rect x="0" y="200" width="10" height="30" class="bar-low" rx="4"/>
      <text x="10" y="220" fill="#757575" font-size="11">设置</text>
      <text x="10" y="240" fill="#757575" font-size="9">...</text>
    </g>
  </g>
  
  <!-- Key Insight -->
  <g transform="translate(550, 130)">
    <rect x="0" y="0" width="230" height="180" fill="#e8f5e9" rx="10"/>
    <text x="115" y="30" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="bold">💡 设计启示</text>
    
    <text x="20" y="60" fill="#333" font-size="11">1. 优先优化核心功能</text>
    <text x="20" y="80" fill="#333" font-size="11">   (浏览、搜索、收藏)</text>
    
    <text x="20" y="110" fill="#333" font-size="11">2. 80% 用户只用 20% 功能</text>
    <text x="20" y="130" fill="#333" font-size="11">   不要花太多时间在</text>
    <text x="20" y="145" fill="#333" font-size="11">   低频功能上</text>
    
    <text x="20" y="170" fill="#2e7d32" font-size="11">✓ 用数据驱动设计决策</text>
  </g>
</svg>