<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bad-bg { fill: #ffebee; }
      .good-bg { fill: #e8f5e9; }
      .browser { fill: white; stroke: #e0e0e0; rx: 8; }
      .toolbar { fill: #f5f5f5; }
      .nav { fill: #f8f8f8; }
      .search { fill: white; stroke: #ccc; rx: 4; }
      .logo { fill: #1a1a1a; font-family: Arial; font-weight: bold; }
      .cart { fill: #757575; }
      .icon { fill: #616161; }
    </style>
  </defs>
  
  <!-- BAD Example -->
  <rect x="10" y="10" width="380" height="380" class="bad-bg" rx="10"/>
  <text x="200" y="45" text-anchor="middle" fill="#c62828" font-size="18" font-weight="bold">❌ BAD - 反直觉设计</text>
  
  <!-- Browser with unconventional layout -->
  <g transform="translate(40, 65)">
    <rect x="0" y="0" width="320" height="280" class="browser"/>
    <!-- Toolbar -->
    <rect x="0" y="0" width="320" height="30" class="toolbar"/>
    
    <!-- Unconventional: Search at bottom, logo does something else -->
    <rect x="0" y="280" width="320" height="30" class="toolbar"/>
    <rect x="10" y="285" width="300" height="20" class="search"/>
    <text x="20" y="299" fill="#999" font-size="10">搜索...</text>
    
    <!-- Logo at bottom left -->
    <text x="10" y="25" class="logo" font-size="12">☰ 菜单</text>
    
    <!-- Cart at bottom left -->
    <text x="60" y="25" font-size="12" fill="#616161">🛒</text>
    
    <!-- Content in middle - confusing -->
    <rect x="20" y="50" width="280" height="40" fill="#fce4ec" rx="4"/>
    <text x="160" y="75" text-anchor="middle" fill="#c62828" font-size="11">⚠️ 使用前请阅读指南</text>
    
    <rect x="20" y="100" width="280" height="60" fill="#f5f5f5" rx="4"/>
    <text x="160" y="125" text-anchor="middle" fill="#333" font-size="10">这里是特殊布局</text>
    <text x="160" y="145" text-anchor="middle" fill="#757575" font-size="9">与大多数网站不同</text>
    
    <rect x="20" y="170" width="280" height="60" fill="#f5f5f5" rx="4"/>
    <text x="160" y="195" text-anchor="middle" fill="#333" font-size="10">需要用户重新学习</text>
    <text x="160" y="215" text-anchor="middle" fill="#757575" font-size="9">增加认知负担</text>
    
    <text x="160" y="260" text-anchor="middle" fill="#c62828" font-size="11">❓ 用户困惑：这是什么网站？</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 400 200 L 430 200" stroke="#2196f3" stroke-width="3" fill="none"/>
  <polygon points="430,200 420,195 420,205" fill="#2196f3"/>
  
  <!-- GOOD Example -->
  <rect x="410" y="10" width="380" height="380" class="good-bg" rx="10"/>
  <text x="600" y="45" text-anchor="middle" fill="#2e7d32" font-size="18" font-weight="bold">✅ GOOD - 符合预期</text>
  
  <!-- Standard familiar layout -->
  <g transform="translate(440, 65)">
    <rect x="0" y="0" width="320" height="280" class="browser"/>
    <!-- Toolbar -->
    <rect x="0" y="0" width="320" height="30" class="toolbar"/>
    
    <!-- Standard: Logo top-left, Search top-center, Cart top-right -->
    <text x="10" y="20" class="logo" font-size="14">MyShop</text>
    
    <rect x="100" y="5" width="150" height="20" class="search"/>
    <text x="110" y="19" fill="#999" font-size="10">搜索商品...</text>
    
    <text x="285" y="20" font-size="12" class="cart">🛒</text>
    
    <!-- Standard navigation -->
    <rect x="0" y="35" width="320" height="25" class="nav"/>
    <text x="30" y="52" fill="#333" font-size="11">首页</text>
    <text x="80" y="52" fill="#333" font-size="11">分类</text>
    <text x="130" y="52" fill="#333" font-size="11">优惠券</text>
    <text x="190" y="52" fill="#333" font-size="11">我的</text>
    
    <!-- Content - familiar layout -->
    <rect x="20" y="75" width="280" height="80" fill="#e3f2fd" rx="4"/>
    <text x="160" y="100" text-anchor="middle" fill="#1565c0" font-size="12">🎉 新用户首单立减 20 元</text>
    <rect x="80" y="115" width="160" height="25" fill="#2196f3" rx="4"/>
    <text x="160" y="132" text-anchor="middle" fill="white" font-size="11">立即领取</text>
    
    <rect x="20" y="165" width="130" height="80" fill="#f5f5f5" rx="4"/>
    <rect x="170" y="165" width="130" height="80" fill="#f5f5f5" rx="4"/>
    <text x="85" y="200" text-anchor="middle" fill="#333" font-size="10">热门商品</text>
    <text x="235" y="200" text-anchor="middle" fill="#333" font-size="10">新品上架</text>
    
    <text x="160" y="260" text-anchor="middle" fill="#2e7d32" font-size="11">✅ 用户：熟悉！知道怎么用</text>
  </g>
</svg>