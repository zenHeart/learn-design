<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bad-bg { fill: #ffebee; }
      .good-bg { fill: #e8f5e9; }
      .clock { fill: #e0e0e0; }
      .clock-bad { fill: #ffcdd2; stroke: #c62828; }
      .clock-good { fill: #c8e6c9; stroke: #4caf50; }
      .lightning { fill: #ffc107; }
    </style>
  </defs>
  
  <!-- BAD Example -->
  <rect x="10" y="10" width="380" height="380" class="bad-bg" rx="10"/>
  <text x="200" y="45" text-anchor="middle" fill="#c62828" font-size="18" font-weight="bold">❌ 响应太慢 (>400ms)</text>
  
  <g transform="translate(80, 80)">
    <!-- Loading spinner / hourglass -->
    <circle cx="100" cy="80" r="60" class="clock-bad" stroke-width="4"/>
    <text x="100" y="75" text-anchor="middle" fill="#c62828" font-size="14" font-weight="bold">Loading...</text>
    <text x="100" y="100" text-anchor="middle" fill="#c62828" font-size="28" font-weight="bold">5s</text>
    
    <!-- Sad face -->
    <circle cx="100" cy="200" r="50" fill="#ffcdd2"/>
    <circle cx="80" cy="190" r="6" fill="#333"/>
    <circle cx="120" cy="190" r="6" fill="#333"/>
    <path d="M 75 215 Q 100 200 125 215" stroke="#333" stroke-width="3" fill="none"/>
    
    <!-- Consequence -->
    <rect x="0" y="270" width="200" height="60" fill="#ffcdd2" rx="8"/>
    <text x="100" y="295" text-anchor="middle" fill="#c62828" font-size="12">😰 用户感到沮丧</text>
    <text x="100" y="315" text-anchor="middle" fill="#c62828" font-size="11">开始分心，效率下降</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 400 200 L 430 200" stroke="#2196f3" stroke-width="3" fill="none"/>
  <polygon points="430,200 420,195 420,205" fill="#2196f3"/>
  
  <!-- GOOD Example -->
  <rect x="410" y="10" width="380" height="380" class="good-bg" rx="10"/>
  <text x="600" y="45" text-anchor="middle" fill="#2e7d32" font-size="18" font-weight="bold">✅ 响应及时 (<400ms)</text>
  
  <g transform="translate(480, 80)">
    <!-- Instant checkmark -->
    <circle cx="100" cy="80" r="60" class="clock-good" stroke-width="4"/>
    <path d="M 70 80 L 90 100 L 130 60" stroke="#4caf50" stroke-width="6" fill="none"/>
    
    <!-- Lightning bolt for speed -->
    <polygon points="100,150 90,180 100,170 110,200 120,165 110,175 120,150" fill="#ffc107"/>
    
    <!-- Happy face -->
    <circle cx="100" cy="200" r="50" fill="#c8e6c9"/>
    <circle cx="80" cy="190" r="6" fill="#333"/>
    <circle cx="120" cy="190" r="6" fill="#333"/>
    <path d="M 75 210 Q 100 235 125 210" stroke="#333" stroke-width="3" fill="none"/>
    
    <!-- Benefit -->
    <rect x="0" y="270" width="200" height="60" fill="#c8e6c9" rx="8"/>
    <text x="100" y="295" text-anchor="middle" fill="#2e7d32" font-size="12">😊 用户保持专注</text>
    <text x="100" y="315" text-anchor="middle" fill="#2e7d32" font-size="11">生产力大幅提升！</text>
  </g>
</svg>