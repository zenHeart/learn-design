<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bad-bg { fill: #ffebee; }
      .good-bg { fill: #e8f5e9; }
      .bad-text { fill: #c62828; font-family: Arial; font-weight: bold; }
      .good-text { fill: #2e7d32; font-family: Arial; font-weight: bold; }
      .product { fill: white; stroke: #bdbdbd; rx: 8; }
      .product-img { fill: #e0e0e0; }
      .tag { fill: #f44336; rx: 10; }
      .tag-good { fill: #4caf50; rx: 10; }
    </style>
  </defs>
  
  <!-- BAD Example -->
  <rect x="10" y="10" width="380" height="380" class="bad-bg" rx="10"/>
  <text x="200" y="45" text-anchor="middle" class="bad-text" font-size="18">❌ BAD - 选择过载</text>
  
  <!-- Grid of many products - overwhelming -->
  <g transform="translate(25, 60)">
    <text fill="#c62828" font-size="12" y="0">显示 50+ 个商品分类</text>
    
    <!-- Product grid 4x3 -->
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="75" height="90" class="product"/>
      <rect x="10" y="10" width="55" height="45" class="product-img"/>
      <rect x="5" y="60" width="65" height="8" fill="#e0e0e0" rx="2"/>
      <rect x="5" y="72" width="40" height="8" fill="#e0e0e0" rx="2"/>
      
      <rect x="85" y="0" width="75" height="90" class="product"/>
      <rect x="95" y="10" width="55" height="45" class="product-img"/>
      <rect x="90" y="60" width="65" height="8" fill="#e0e0e0" rx="2"/>
      <rect x="90" y="72" width="40" height="8" fill="#e0e0e0" rx="2"/>
      
      <rect x="170" y="0" width="75" height="90" class="product"/>
      <rect x="180" y="10" width="55" height="45" class="product-img"/>
      <rect x="175" y="60" width="65" height="8" fill="#e0e0e0" rx="2"/>
      <rect x="175" y="72" width="40" height="8" fill="#e0e0e0" rx="2"/>
      
      <rect x="255" y="0" width="75" height="90" class="product"/>
      <rect x="265" y="10" width="55" height="45" class="product-img"/>
      <rect x="260" y="60" width="65" height="8" fill="#e0e0e0" rx="2"/>
      <rect x="260" y="72" width="40" height="8" fill="#e0e0e0" rx="2"/>
    </g>
    
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="75" height="90" class="product"/>
      <rect x="85" y="0" width="75" height="90" class="product"/>
      <rect x="170" y="0" width="75" height="90" class="product"/>
      <rect x="255" y="0" width="75" height="90" class="product"/>
    </g>
    
    <text x="165" y="220" text-anchor="middle" fill="#c62828" font-size="11">太多了！不知道选哪个</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 400 200 L 430 200" stroke="#2196f3" stroke-width="3" fill="none"/>
  <polygon points="430,200 420,195 420,205" fill="#2196f3"/>
  
  <!-- GOOD Example -->
  <rect x="410" y="10" width="380" height="380" class="good-bg" rx="10"/>
  <text x="600" y="45" text-anchor="middle" class="good-text" font-size="18">✅ GOOD - 精选推荐</text>
  
  <!-- Smart recommendations -->
  <g transform="translate(430, 70)">
    <rect x="0" y="0" width="340" height="35" fill="#4caf50" rx="8"/>
    <text x="170" y="23" text-anchor="middle" fill="white" font-size="14" font-weight="bold">✨ 为您精选</text>
    
    <!-- Only 4 recommended products -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="80" height="110" class="product"/>
      <rect x="10" y="10" width="60" height="55" class="product-img"/>
      <rect x="5" y="70" width="70" height="8" fill="#e0e0e0" rx="2"/>
      <rect x="5" y="82" width="50" height="8" fill="#e0e0e0" rx="2"/>
      <rect x="5" y="94" width="30" height="12" class="tag-good"/>
      <text x="20" y="104" fill="white" font-size="9">热卖</text>
      
      <rect x="90" y="0" width="80" height="110" class="product"/>
      <rect x="100" y="10" width="60" height="55" class="product-img"/>
      <rect x="95" y="70" width="70" height="8" fill="#e0e0e0" rx="2"/>
      <rect x="95" y="82" width="50" height="8" fill="#e0e0e0" rx="2"/>
      <rect x="95" y="94" width="40" height="12" class="tag-good"/>
      <text x="115" y="104" fill="white" font-size="9">新品</text>
      
      <rect x="180" y="0" width="80" height="110" class="product"/>
      <rect x="190" y="10" width="60" height="55" class="product-img"/>
      <rect x="185" y="70" width="70" height="8" fill="#e0e0e0" rx="2"/>
      <rect x="185" y="82" width="50" height="8" fill="#e0e0e0" rx="2"/>
      <rect x="185" y="94" width="45" height="12" class="tag-good"/>
      <text x="207" y="104" fill="white" font-size="9">特惠</text>
      
      <rect x="270" y="0" width="80" height="110" class="product"/>
      <rect x="280" y="10" width="60" height="55" class="product-img"/>
      <rect x="275" y="70" width="70" height="8" fill="#e0e0e0" rx="2"/>
      <rect x="275" y="82" width="50" height="8" fill="#e0e0e0" rx="2"/>
    </g>
    
    <text x="170" y="195" text-anchor="middle" fill="#2e7d32" font-size="12">精选 4 个选项，轻松做决定</text>
    <text x="170" y="215" text-anchor="middle" fill="#757575" font-size="11">更多商品 →</text>
  </g>
</svg>