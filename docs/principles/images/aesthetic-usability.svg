<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bad-bg { fill: #ffebee; }
      .good-bg { fill: #e8f5e9; }
      .phone { fill: #212121; rx: 20; }
      .screen { fill: #424242; }
      .ugly { fill: #9e9e9e; }
      .beautiful { fill: linear-gradient(#667eea, #764ba2); }
      .btn-ugly { fill: #757575; }
      .btn-beautiful { fill: #667eea; }
    </style>
  </defs>
  
  <!-- BAD Example -->
  <rect x="10" y="10" width="380" height="380" class="bad-bg" rx="10"/>
  <text x="200" y="45" text-anchor="middle" fill="#c62828" font-size="18" font-weight="bold">❌ 缺乏美感的界面</text>
  
  <!-- Ugly phone UI -->
  <g transform="translate(70, 70)">
    <rect x="0" y="0" width="160" height="280" class="phone" rx="20"/>
    <rect x="10" y="30" width="140" height="220" fill="#616161"/>
    
    <!-- Ugly header -->
    <rect x="10" y="30" width="140" height="30" fill="#757575"/>
    <text x="80" y="50" text-anchor="middle" fill="#e0e0e0" font-size="10">应用名称</text>
    
    <!-- Ugly content -->
    <rect x="20" y="75" width="120" height="40" fill="#757575" rx="2"/>
    <rect x="20" y="125" width="120" height="40" fill="#757575" rx="2"/>
    <rect x="20" y="175" width="120" height="40" fill="#757575" rx="2"/>
    
    <!-- Ugly button -->
    <rect x="35" y="230" width="90" height="25" class="btn-ugly" rx="0"/>
    <text x="80" y="247" text-anchor="middle" fill="white" font-size="10">提交</text>
    
    <!-- User reaction -->
    <g transform="translate(-30, 200)">
      <circle cx="50" cy="50" r="40" fill="#ffccbc"/>
      <text x="50" y="45" text-anchor="middle" font-size="24">😕</text>
      <text x="50" y="100" text-anchor="middle" fill="#c62828" font-size="11">容忍度低</text>
      <text x="50" y="115" text-anchor="middle" fill="#c62828" font-size="10">遇到问题会抱怨</text>
    </g>
  </g>
  
  <!-- Arrow -->
  <path d="M 400 200 L 430 200" stroke="#2196f3" stroke-width="3" fill="none"/>
  <polygon points="430,200 420,195 420,205" fill="#2196f3"/>
  
  <!-- GOOD Example -->
  <rect x="410" y="10" width="380" height="380" class="good-bg" rx="10"/>
  <text x="600" y="45" text-anchor="middle" fill="#2e7d32" font-size="18" font-weight="bold">✅ 美观的界面</text>
  
  <!-- Beautiful phone UI -->
  <g transform="translate(470, 70)">
    <rect x="0" y="0" width="160" height="280" class="phone" rx="20"/>
    <rect x="10" y="30" width="140" height="220" fill="white"/>
    
    <!-- Beautiful header with gradient -->
    <defs>
      <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#667eea"/>
        <stop offset="100%" style="stop-color:#764ba2"/>
      </linearGradient>
    </defs>
    <rect x="10" y="30" width="140" height="30" fill="url(#headerGrad)"/>
    <text x="80" y="50" text-anchor="middle" fill="white" font-size="10" font-weight="bold">✨ 应用名称</text>
    
    <!-- Beautiful content cards -->
    <rect x="20" y="75" width="120" height="40" fill="#f8f9ff" rx="8"/>
    <rect x="20" y="125" width="120" height="40" fill="#f8f9ff" rx="8"/>
    <rect x="20" y="175" width="120" height="40" fill="#f8f9ff" rx="8"/>
    
    <!-- Beautiful button -->
    <rect x="35" y="230" width="90" height="25" fill="url(#headerGrad)" rx="12"/>
    <text x="80" y="247" text-anchor="middle" fill="white" font-size="10" font-weight="bold">提交 ✓</text>
    
    <!-- User reaction -->
    <g transform="translate(-30, 200)">
      <circle cx="50" cy="50" r="40" fill="#c8e6c9"/>
      <text x="50" y="45" text-anchor="middle" font-size="24">😊</text>
      <text x="50" y="100" text-anchor="middle" fill="#2e7d32" font-size="11">容忍度高</text>
      <text x="50" y="115" text-anchor="middle" fill="#2e7d32" font-size="10">愿意重试，易原谅小问题</text>
    </g>
  </g>
</svg>