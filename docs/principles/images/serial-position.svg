<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bad-bg { fill: #ffebee; }
      .good-bg { fill: #e8f5e9; }
      .nav-item { fill: white; stroke: #e0e0e0; }
      .nav-item-active { fill: #e3f2fd; stroke: #2196f3; }
      .highlight { fill: #fff59d; }
      .star { fill: #ffc107; }
    </style>
  </defs>
  
  <!-- BAD Example -->
  <rect x="10" y="10" width="380" height="380" class="bad-bg" rx="10"/>
  <text x="200" y="45" text-anchor="middle" fill="#c62828" font-size="18" font-weight="bold">❌ 不考虑序列位置</text>
  
  <!-- Random navigation order -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="320" height="60" fill="#f5f5f5" rx="8"/>
    
    <!-- Nav items in random order -->
    <rect x="10" y="10" width="50" height="40" class="nav-item" rx="4"/>
    <text x="35" y="35" text-anchor="middle" fill="#333" font-size="10">设置</text>
    
    <rect x="70" y="10" width="50" height="40" class="nav-item" rx="4"/>
    <text x="95" y="35" text-anchor="middle" fill="#333" font-size="10">消息</text>
    
    <rect x="130" y="10" width="50" height="40" class="nav-item" rx="4"/>
    <text x="155" y="35" text-anchor="middle" fill="#333" font-size="10">首页</text>
    
    <rect x="190" y="10" width="50" height="40" class="nav-item" rx="4"/>
    <text x="215" y="35" text-anchor="middle" fill="#333" font-size="10">我的</text>
    
    <rect x="250" y="10" width="50" height="40" class="nav-item" rx="4"/>
    <text x="275" y="35" text-anchor="middle" fill="#333" font-size="10">分类</text>
    
    <text x="160" y="90" text-anchor="middle" fill="#c62828" font-size="12">重要功能（首页、我的）</text>
    <text x="160" y="108" text-anchor="middle" fill="#c62828" font-size="12">被放在中间位置，容易被遗忘</text>
    
    <!-- Memory indicator -->
    <g transform="translate(50, 130)">
      <rect x="0" y="0" width="220" height="80" fill="#ffcdd2" rx="8"/>
      <text x="110" y="20" text-anchor="middle" fill="#c62828" font-size="11" font-weight="bold">记忆测试</text>
      
      <text x="30" y="45" fill="#757575" font-size="9">记住的项目:</text>
      <text x="30" y="62" fill="#c62828" font-size="9">设置、消息、首页、我的、分类</text>
      <text x="30" y="75" fill="#c62828" font-size="9">→ 中间项目记忆模糊</text>
    </g>
  </g>
  
  <!-- Arrow -->
  <path d="M 400 200 L 430 200" stroke="#2196f3" stroke-width="3" fill="none"/>
  <polygon points="430,200 420,195 420,205" fill="#2196f3"/>
  
  <!-- GOOD Example -->
  <rect x="410" y="10" width="380" height="380" class="good-bg" rx="10"/>
  <text x="600" y="45" text-anchor="middle" fill="#2e7d32" font-size="18" font-weight="bold">✅ 善用首因/近因效应</text>
  
  <!-- Strategic navigation order -->
  <g transform="translate(440, 80)">
    <rect x="0" y="0" width="320" height="60" fill="#f5f5f5" rx="8"/>
    
    <!-- Nav items in strategic order - important at first and last -->
    <!-- Position 1: Highlighted (First - Primacy) -->
    <rect x="10" y="10" width="50" height="40" class="nav-item-active" rx="4"/>
    <text x="35" y="28" text-anchor="middle" fill="#2196f3" font-size="10" font-weight="bold">首页</text>
    <text x="35" y="42" text-anchor="middle" fill="#2196f3" font-size="14">★</text>
    
    <rect x="70" y="10" width="50" height="40" class="nav-item" rx="4"/>
    <text x="95" y="35" text-anchor="middle" fill="#333" font-size="10">分类</text>
    
    <rect x="130" y="10" width="50" height="40" class="nav-item" rx="4"/>
    <text x="155" y="35" text-anchor="middle" fill="#333" font-size="10">消息</text>
    
    <rect x="190" y="10" width="50" height="40" class="nav-item" rx="4"/>
    <text x="215" y="35" text-anchor="middle" fill="#333" font-size="10">设置</text>
    
    <!-- Position 5: Highlighted (Last - Recency) -->
    <rect x="250" y="10" width="50" height="40" class="nav-item-active" rx="4"/>
    <text x="275" y="28" text-anchor="middle" fill="#2196f3" font-size="10" font-weight="bold">我的</text>
    <text x="275" y="42" text-anchor="middle" fill="#2196f3" font-size="14">★</text>
    
    <text x="160" y="90" text-anchor="middle" fill="#2e7d32" font-size="12">重要功能（首页、我的）</text>
    <text x="160" y="108" text-anchor="middle" fill="#2e7d32" font-size="12">放在首位和末位，容易记住</text>
    
    <!-- Memory indicator -->
    <g transform="translate(50, 130)">
      <rect x="0" y="0" width="220" height="80" fill="#c8e6c9" rx="8"/>
      <text x="110" y="20" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="bold">记忆测试</text>
      
      <text x="30" y="45" fill="#2e7d32" font-size="9">记住的项目:</text>
      <text x="30" y="62" fill="#2e7d32" font-size="9">⭐ 首页 ⭐ ... ⭐ 我的 ⭐</text>
      <text x="30" y="75" fill="#2e7d32" font-size="9">→ 首尾印象深刻 ✓</text>
    </g>
  </g>
</svg>