<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bad-bg { fill: #ffebee; }
      .good-bg { fill: #e8f5e9; }
      .bad-text { fill: #c62828; font-family: Arial; font-weight: bold; }
      .good-text { fill: #2e7d32; font-family: Arial; font-weight: bold; }
      .phone { fill: #212121; rx: 20; }
      .screen { fill: #424242; }
      .btn-small { fill: #f44336; rx: 4; }
      .btn-large { fill: #4caf50; rx: 8; }
      .target-small { fill: #ff5722; }
      .target-large { fill: #8bc34a; }
    </style>
  </defs>
  
  <!-- BAD Example -->
  <rect x="10" y="10" width="380" height="380" class="bad-bg" rx="10"/>
  <text x="200" y="45" text-anchor="middle" class="bad-text" font-size="18">❌ BAD - 难以点击</text>
  
  <!-- Phone outline -->
  <rect x="120" y="60" width="160" height="280" class="phone" rx="20"/>
  <rect x="130" y="90" width="140" height="220" class="screen"/>
  
  <!-- Small hard-to-click button at top -->
  <rect x="180" y="100" width="40" height="20" class="btn-small"/>
  <text x="200" y="114" text-anchor="middle" fill="white" font-size="8">删除</text>
  
  <!-- Long finger path indicator -->
  <path d="M 200 280 Q 200 190 200 110" stroke="#ff9800" stroke-width="3" stroke-dasharray="5,3" fill="none"/>
  <text x="220" y="200" fill="#e65100" font-size="11">手指移动</text>
  <text x="220" y="215" fill="#e65100" font-size="11">距离远</text>
  
  <text x="200" y="365" text-anchor="middle" fill="#c62828" font-size="12">小按钮 + 远距离 = 难点击</text>
  
  <!-- Arrow -->
  <path d="M 400 200 L 430 200" stroke="#2196f3" stroke-width="3" fill="none"/>
  <polygon points="430,200 420,195 420,205" fill="#2196f3"/>
  
  <!-- GOOD Example -->
  <rect x="410" y="10" width="380" height="380" class="good-bg" rx="10"/>
  <text x="600" y="45" text-anchor="middle" class="good-text" font-size="18">✅ GOOD - 易于点击</text>
  
  <!-- Phone outline -->
  <rect x="520" y="60" width="160" height="280" class="phone" rx="20"/>
  <rect x="530" y="90" width="140" height="220" class="screen"/>
  
  <!-- Large easy-to-click button at bottom center -->
  <rect x="545" y="250" width="110" height="45" class="btn-large"/>
  <text x="600" y="278" text-anchor="middle" fill="white" font-size="14">✓ 确认</text>
  
  <!-- Short finger path indicator -->
  <path d="M 600 280 Q 600 290 600 295" stroke="#4caf50" stroke-width="3" fill="none"/>
  <text x="620" y="280" fill="#2e7d32" font-size="11">手指自然落点</text>
  
  <text x="600" y="365" text-anchor="middle" fill="#2e7d32" font-size="12">大按钮 + 底部 = 容易点击</text>
</svg>